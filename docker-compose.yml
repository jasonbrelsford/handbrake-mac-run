
version: "3.8"

services:
  handbrake:
    build: .
    volumes:
      - ~/Movies:/output                 # Output location
      - ~/Desktop:/input                 # Monitors Mac Desktop
      - ./gdrive-creds:/root/.gdrive     # persist credentials
    environment:
      - INPUT_DIR=/input
      - OUTPUT_DIR=/output
      - COMPOSE_BAKE=true
      - RESOLUTION=720
    restart: unless-stopped

  transcriber:
    build: ./transcribe
    volumes:
      - ~/Movies:/output                 # Output location (same as handbrake)
      - ~/Desktop:/input                 # Input location (same as handbrake)
      - ./gdrive-creds:/root/.gdrive     # persist credentials
    environment:
      - INPUT_DIR=/input
      - OUTPUT_DIR=/output
      - COMPOSE_BAKE=true
    restart: unless-stopped

